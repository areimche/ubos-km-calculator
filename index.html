<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UBOS KM Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="toolbar">
        <div class="language-switch">
          <label for="languageSelect" id="languageLabel"></label>
          <select id="languageSelect">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <h1 id="appTitle"></h1>
      <p class="hint" id="appHint"></p>

      <section class="card">
        <div class="field">
          <label for="fromTeam" id="fromTeamLabel"></label>
          <select id="fromTeam" disabled>
            <option value=""></option>
          </select>
        </div>
        <div class="field">
          <label for="toTeam" id="toTeamLabel"></label>
          <select id="toTeam" disabled>
            <option value=""></option>
          </select>
        </div>
        <button id="calculate" type="button" disabled></button>
        <output id="result" class="result" aria-live="polite"></output>
      </section>
    </main>
  </body>
</html>
